<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Red Squircle Background -->
  <rect x="20" y="20" width="160" height="160" rx="40" ry="40" fill="#CC0000"/>

  <!-- Letter R (White) -->
  <text x="70" y="120" font-family="Poppins, Arial, sans-serif" font-size="64" font-weight="700" fill="white" text-anchor="middle">R</text>

  <!-- Letter M (Yellow) -->
  <text x="130" y="120" font-family="Poppins, Arial, sans-serif" font-size="64" font-weight="700" fill="#FFD700" text-anchor="middle">M</text>

  <!-- Left Eye (Black dot) -->
  <circle cx="80" cy="155" r="6" fill="black"/>

  <!-- Right Eye (Black dot) -->
  <circle cx="120" cy="155" r="6" fill="black"/>

  <!-- Smile (Curved line) -->
  <path d="M 85 170 Q 100 180 115 170" stroke="black" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
